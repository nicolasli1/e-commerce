AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NexCore Sales Website — AWS serverless stack.
  S3 + CloudFront + WAF + API Gateway + Lambda + DynamoDB.
  Secrets stored in SSM Parameter Store (SecureString).
  Primary IaC for the NexCore sales website — CloudFormation.

Parameters:
  ProjectName:
    Type: String
    Default: sales-website
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod
  EnableBackend:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
  AlarmEmail:
    Type: String
    Default: ''
    Description: Email for CloudWatch alarm notifications (empty = no alarms)

Conditions:
  BackendEnabled: !Equals [!Ref EnableBackend, 'true']
  AlarmsEnabled: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:

  # ======================================================================
  # S3 BUCKETS — private, encrypted, versioned
  # ======================================================================
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-${AWS::Region}-site'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: TransitionToIA
            Status: Enabled
            ExpirationInDays: 365
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90

  # Separate S3 bucket for CloudFront logs — breaks circular dependency
  LogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-${AWS::Region}-logs'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogsAfter90Days
            Status: Enabled
            ExpirationInDays: 90

  # ======================================================================
  # CLOUDFRONT ORIGIN ACCESS CONTROL
  # ======================================================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${Environment}-oac'
        Description: CloudFront to private S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ======================================================================
  # CLOUDFRONT SECURITY HEADERS POLICY
  # ======================================================================
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-${Environment}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:;"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true

  # ======================================================================
  # CLOUDFRONT FUNCTION — SPA routing for /admin/
  # ======================================================================
  AdminAuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-admin-auth'
      AutoPublish: true
      FunctionCode: |
        // CloudFront Function for /admin/ routes
        // 1. SPA fallback: rewrites /admin/* paths without extensions to /admin/index.html
        // 2. Allows public paths (login page, assets)
        var COOKIE_NAME = "session";
        var FILE_EXTENSIONS = [".js", ".css", ".png", ".jpg", ".jpeg", ".svg", ".ico", ".woff", ".woff2", ".json", ".webp", ".gif"];
        var PUBLIC_ADMIN_PATHS = ["/admin/login", "/admin/assets/"];

        function handler(event) {
            var request = event.request;
            var uri = request.uri;
            var cookies = request.cookies;

            // Allow public admin paths (login page, assets)
            for (var i = 0; i < PUBLIC_ADMIN_PATHS.length; i++) {
                if (uri.startsWith(PUBLIC_ADMIN_PATHS[i])) {
                    return request;
                }
            }

            // Real file request (has extension) — let it through
            for (var i = 0; i < FILE_EXTENSIONS.length; i++) {
                if (uri.indexOf(FILE_EXTENSIONS[i]) === uri.length - FILE_EXTENSIONS[i].length) {
                    return request;
                }
            }

            // SPA fallback: serve /admin/index.html
            if (uri !== "/admin/index.html") {
                request.uri = "/admin/index.html";
            }

            return request;
        }
      FunctionConfig:
        Comment: SPA routing for /admin/ + cookie validation
        Runtime: cloudfront-js-2.0

  # ======================================================================
  # WAF WEB ACL — AWS managed rules + rate limiting
  # ======================================================================
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      DefaultAction:
        Allow: {}
      Scope: CLOUDFRONT
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-${Environment}-waf'
        SampledRequestsEnabled: true
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AWS-AWSManagedRulesCommonRuleSet
            SampledRequestsEnabled: true
        - Name: AWS-AWSManagedRulesSQLiRuleSet
          Priority: 2
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AWS-AWSManagedRulesSQLiRuleSet
            SampledRequestsEnabled: true
        - Name: AWS-AWSManagedRulesKnownBadInputsRuleSet
          Priority: 3
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AWS-AWSManagedRulesKnownBadInputsRuleSet
            SampledRequestsEnabled: true
        - Name: RateLimit
          Priority: 4
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: RateLimit
            SampledRequestsEnabled: true

  # ======================================================================
  # CLOUDFRONT DISTRIBUTION
  # ======================================================================
  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - WebsiteBucket
      - LogsBucket
      - CloudFrontOAC
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName}-${Environment} sales website'
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Origins:
          - Id: site-s3
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
          - !If
            - BackendEnabled
            - Id: api-origin
              DomainName: !Select [2, !Split ['/', !GetAtt HttpApi.ApiEndpoint]]
              CustomOriginConfig:
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          # Managed CachePolicy ID: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - !If
            - BackendEnabled
            - PathPattern: api/*
              TargetOriginId: api-origin
              ViewerProtocolPolicy: redirect-to-https
              Compress: true
              AllowedMethods:
                - GET
                - HEAD
                - OPTIONS
                - PUT
                - POST
                - PATCH
                - DELETE
              CachedMethods:
                - GET
                - HEAD
              # Managed CachePolicy ID: CachingDisabled
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
              # Managed OriginRequestPolicy: AllViewerExceptHostHeader
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            - !Ref AWS::NoValue
          - PathPattern: admin/*
            TargetOriginId: site-s3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt AdminAuthFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Logging:
          Bucket: !GetAtt LogsBucket.RegionalDomainName
          Prefix: !Sub 'cloudfront-logs/${Environment}/'
          IncludeCookies: false

  # ======================================================================
  # S3 BUCKET POLICIES
  # ======================================================================
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontLogDelivery
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${LogsBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

  # ======================================================================
  # DYNAMODB TABLES — on-demand capacity, SSE, PITR
  # ======================================================================
  LeadsTable:
    Type: AWS::DynamoDB::Table
    Condition: BackendEnabled
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-leads'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-leads'
        - Key: Environment
          Value: !Ref Environment

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Condition: BackendEnabled
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-products'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-products'
        - Key: Environment
          Value: !Ref Environment

  QuotesTable:
    Type: AWS::DynamoDB::Table
    Condition: BackendEnabled
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-quotes'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quoteId
          AttributeType: S
      KeySchema:
        - AttributeName: quoteId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-quotes'
        - Key: Environment
          Value: !Ref Environment

  # ======================================================================
  # IAM ROLE — Lambda with DynamoDB + SSM access
  # ======================================================================
  ApiLambdaRole:
    Type: AWS::IAM::Role
    Condition: BackendEnabled
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-api-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: dynamodb-admin-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt LeadsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt ProductsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: !GetAtt QuotesTable.Arn
        - PolicyName: ssm-secrets-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/admin-user'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/admin-password'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/admin-session-secret'

  # ======================================================================
  # LAMBDA — API handler with full admin CRUD
  # ======================================================================
  ApiLambda:
    Type: AWS::Lambda::Function
    Condition: BackendEnabled
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-api'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          LEADS_TABLE: !Ref LeadsTable
          PRODUCTS_TABLE: !Ref ProductsTable
          QUOTES_TABLE: !Ref QuotesTable
          ENVIRONMENT: !Ref Environment
          SSM_SECRET_PATH: !Sub '/${ProjectName}/${Environment}/'
      Code:
        ZipFile: |
          import json, os, uuid, hashlib, hmac, base64, time
          from datetime import datetime, timezone
          import boto3

          dynamodb = boto3.resource("dynamodb")
          ssm = boto3.client("ssm")
          leads_table = dynamodb.Table(os.environ["LEADS_TABLE"])
          products_table = dynamodb.Table(os.environ["PRODUCTS_TABLE"])
          quotes_table = dynamodb.Table(os.environ["QUOTES_TABLE"])
          SSM_SECRET_PATH = os.environ["SSM_SECRET_PATH"]
          ENVIRONMENT = os.environ.get("ENVIRONMENT", "dev")

          _secret_cache = {}
          _secret_cache_ts = 0
          _SECRET_CACHE_TTL = 900

          def _get_secret(param_name):
              global _secret_cache, _secret_cache_ts
              now = time.time()
              if now - _secret_cache_ts > _SECRET_CACHE_TTL:
                  _secret_cache = {}
                  _secret_cache_ts = now
              if param_name not in _secret_cache:
                  resp = ssm.get_parameter(Name=param_name, WithDecryption=True)
                  _secret_cache[param_name] = resp["Parameter"]["Value"]
              return _secret_cache[param_name]

          def _get_admin_creds():
              return _get_secret(f"{SSM_SECRET_PATH}admin-user"), _get_secret(f"{SSM_SECRET_PATH}admin-password")

          def _get_sess_secret():
              return _get_secret(f"{SSM_SECRET_PATH}admin-session-secret")

          def resp(code, body, **kw):
              h = {"Content-Type": "application/json", **kw}
              return {"statusCode": code, "headers": h, "body": json.dumps(body)}

          def body_json(event):
              try: return json.loads(event.get("body") or "{}")
              except: return None

          def gen_token(user, secret):
              p = base64.b64encode(json.dumps({"user": user, "iat": datetime.now(timezone.utc).isoformat()}).encode()).decode()
              return f"{p}.{hmac.new(secret.encode(), p.encode(), hashlib.sha256).hexdigest()}"

          def verify_tok(token, secret):
              try:
                  parts = token.split(".")
                  if len(parts) != 2: return None
                  p, s = parts
                  e = hmac.new(secret.encode(), p.encode(), hashlib.sha256).hexdigest()
                  if not hmac.compare_digest(s, e): return None
                  return json.loads(base64.b64decode(p).decode()).get("user")
              except: return None

          def handle_login(event):
              b = body_json(event)
              if not b: return resp(400, {"error": "invalid_json"})
              user, pwd = (b.get("username","").strip()), (b.get("password","").strip())
              a_user, a_pass = _get_admin_creds()
              if user == a_user and hashlib.sha256(pwd.encode()).hexdigest() == hashlib.sha256(a_pass.encode()).hexdigest():
                  return resp(200, {"ok": True, "token": gen_token(user, _get_sess_secret())})
              return resp(401, {"error": "invalid_credentials"})

          def auth_required(event):
              a = event.get("headers",{}).get("authorization","") or event.get("headers",{}).get("Authorization","")
              if a.startswith("Bearer "): return verify_tok(a[7:], _get_sess_secret())
              return None

          def list_products():
              items = products_table.scan().get("Items",[])
              items.sort(key=lambda x: x.get("createdAt",""), reverse=True)
              return resp(200, {"ok": True, "products": items})

          def create_product(b):
              if not b: return resp(400, {"error": "invalid_json"})
              for f in ["name","price"]:
                  if not b.get(f): return resp(400, {"error": f"missing_field: {f}"})
              item = {"productId": str(uuid.uuid4()), "name": b["name"].strip(), "description": (b.get("description") or "").strip(), "price": float(b["price"]), "category": (b.get("category") or "general").strip(), "imageUrl": (b.get("imageUrl") or "").strip(), "stock": int(b.get("stock",0)), "status": b.get("status","active").strip(), "createdAt": datetime.now(timezone.utc).isoformat(), "updatedAt": datetime.now(timezone.utc).isoformat()}
              products_table.put_item(Item=item)
              return resp(201, {"ok": True, "product": item})

          def update_product(pid, b):
              if not b: return resp(400, {"error": "invalid_json"})
              exist = products_table.get_item(Key={"productId": pid}).get("Item")
              if not exist: return resp(404, {"error": "not_found"})
              u = {}
              for f in ["name","description","category","imageUrl","status"]:
                  if f in b: u[f] = b[f]
              if "price" in b: u["price"] = float(b["price"])
              if "stock" in b: u["stock"] = int(b["stock"])
              u["updatedAt"] = datetime.now(timezone.utc).isoformat()
              expr = "SET " + ", ".join(f"#{k}=:v{k}" for k in u)
              products_table.update_item(Key={"productId": pid}, UpdateExpression=expr, ExpressionAttributeNames={f"#{k}":k for k in u}, ExpressionAttributeValues={f":v{k}":v for k,v in u.items()})
              return resp(200, {"ok": True, "product": products_table.get_item(Key={"productId": pid}).get("Item")})

          def delete_product(pid):
              exist = products_table.get_item(Key={"productId": pid}).get("Item")
              if not exist: return resp(404, {"error": "not_found"})
              products_table.update_item(Key={"productId": pid}, UpdateExpression="SET #st=:st,#ut=:ut", ExpressionAttributeNames={"#st":"status","#ut":"updatedAt"}, ExpressionAttributeValues={":st":"deleted",":ut":datetime.now(timezone.utc).isoformat()})
              return resp(200, {"ok": True, "deleted": pid})

          def list_leads():
              items = leads_table.scan().get("Items",[])
              items.sort(key=lambda x: x.get("createdAt",""), reverse=True)
              return resp(200, {"ok": True, "leads": items})

          def update_lead(lid, b):
              if not b: return resp(400, {"error": "invalid_json"})
              exist = leads_table.get_item(Key={"id": lid}).get("Item")
              if not exist: return resp(404, {"error": "not_found"})
              u = {}
              if "contacted" in b: u["contacted"] = b["contacted"]
              if "notes" in b: u["notes"] = str(b["notes"])
              if not u: return resp(400, {"error": "no_fields"})
              expr = "SET " + ", ".join(f"#{k}=:v{k}" for k in u)
              leads_table.update_item(Key={"id": lid}, UpdateExpression=expr, ExpressionAttributeNames={f"#{k}":k for k in u}, ExpressionAttributeValues={f":v{k}":v for k,v in u.items()})
              return resp(200, {"ok": True, "lead": leads_table.get_item(Key={"id": lid}).get("Item")})

          def list_quotes():
              items = quotes_table.scan().get("Items",[])
              items.sort(key=lambda x: x.get("createdAt",""), reverse=True)
              return resp(200, {"ok": True, "quotes": items})

          def update_quote(qid, b):
              if not b: return resp(400, {"error": "invalid_json"})
              exist = quotes_table.get_item(Key={"quoteId": qid}).get("Item")
              if not exist: return resp(404, {"error": "not_found"})
              u = {}
              if "status" in b:
                  if b["status"] not in ["pending","contacted","closed","approved"]:
                      return resp(400, {"error": "invalid_status"})
                  u["status"] = b["status"]
              if "notes" in b: u["notes"] = str(b["notes"])
              if not u: return resp(400, {"error": "no_fields"})
              expr = "SET " + ", ".join(f"#{k}=:v{k}" for k in u)
              quotes_table.update_item(Key={"quoteId": qid}, UpdateExpression=expr, ExpressionAttributeNames={f"#{k}":k for k in u}, ExpressionAttributeValues={f":v{k}":v for k,v in u.items()})
              return resp(200, {"ok": True, "quote": quotes_table.get_item(Key={"quoteId": qid}).get("Item")})

          def create_quote(b):
              if not b: return resp(400, {"error": "invalid_json"})
              name = (b.get("name") or "").strip()
              email = (b.get("email") or "").strip().lower()
              if not name or not email: return resp(400, {"error": "name_and_email_required"})
              item = {"quoteId": str(uuid.uuid4()), "name": name, "email": email, "phone": (b.get("phone") or "").strip(), "company": (b.get("company") or "").strip(), "plan": (b.get("plan") or "").strip(), "message": (b.get("message") or "").strip(), "status": "pending", "notes": "", "source": b.get("source", "website"), "createdAt": datetime.now(timezone.utc).isoformat()}
              quotes_table.put_item(Item=item)
              return resp(201, {"ok": True, "quoteId": item["quoteId"]})

          def handle_dashboard():
              products = products_table.scan().get("Items",[])
              leads = leads_table.scan().get("Items",[])
              quotes = quotes_table.scan().get("Items",[])
              active = [p for p in products if p.get("status","active") != "deleted"]
              qs = sorted(quotes, key=lambda x: x.get("createdAt",""), reverse=True)
              return resp(200, {"ok": True, "totalProducts": len(active), "totalLeads": len(leads), "totalQuotes": len(quotes), "recentQuotes": [{"name":q.get("name",""),"email":q.get("email",""),"plan":q.get("plan",""),"status":q.get("status","pending"),"createdAt":q.get("createdAt","")} for q in qs[:5]]})

          def handler(event, context):
              method = event.get("requestContext",{}).get("http",{}).get("method","")
              path = event.get("rawPath","").rstrip("/")
              body = event.get("body")
              try:
                  if method == "GET" and path == "/api/health":
                      return resp(200, {"ok": True, "service": "sales-api", "env": ENVIRONMENT})
                  if method == "POST" and path == "/api/leads":
                      data = body_json(event)
                      if not data: return resp(400, {"error": "invalid_json"})
                      n, e = (data.get("name","").strip()), (data.get("email","").strip().lower())
                      if not n or not e: return resp(400, {"error": "name_and_email_required"})
                      item = {"id": str(uuid.uuid4()), "name": n, "email": e, "phone": (data.get("phone","").strip()), "message": (data.get("message","").strip()), "contacted": False, "notes": "", "source": data.get("source","website"), "createdAt": datetime.now(timezone.utc).isoformat()}
                      leads_table.put_item(Item=item)
                      return resp(201, {"ok": True, "leadId": item["id"]})
                  if method == "POST" and path == "/api/quotes":
                      data = body_json(event)
                      return create_quote(data)
                  if path.startswith("/api/admin"):
                      if method == "POST" and path == "/api/admin/login":
                          return handle_login(event)
                      user = auth_required(event)
                      if not user: return resp(401, {"error": "unauthorized"})
                  if path == "/api/admin/products":
                      if method == "GET": return list_products()
                      if method == "POST": return create_product(body_json(event))
                  if path.startswith("/api/admin/products/"):
                      pid = path.replace("/api/admin/products/","").split("/")[0]
                      if not pid: return resp(400, {"error": "missing_id"})
                      if method == "PUT": return update_product(pid, body_json(event))
                      if method == "DELETE": return delete_product(pid)
                  if path == "/api/admin/dashboard" and method == "GET": return handle_dashboard()
                  if path == "/api/admin/leads":
                      if method == "GET": return list_leads()
                  if path.startswith("/api/admin/leads/"):
                      lid = path.replace("/api/admin/leads/","").split("/")[0]
                      if not lid: return resp(400, {"error": "missing_id"})
                      if method == "PUT": return update_lead(lid, body_json(event))
                  if path == "/api/admin/quotes":
                      if method == "GET": return list_quotes()
                  if path.startswith("/api/admin/quotes/"):
                      qid = path.replace("/api/admin/quotes/","").split("/")[0]
                      if not qid: return resp(400, {"error": "missing_id"})
                      if method == "PUT": return update_quote(qid, body_json(event))
                  return resp(404, {"error": "not_found"})
              except Exception as e:
                  print(f"ERROR: {type(e).__name__}: {e}")
                  return resp(500, {"error": "internal_error"})

  # ======================================================================
  # HTTP API (API Gateway v2)
  # ======================================================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: BackendEnabled
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-http-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Api-Key
        MaxAge: 86400

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  ApiLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiLambda.Arn
      PayloadFormatVersion: '2.0'

  # ── Routes ──
  ApiRouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/health
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteLeads:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/leads
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteQuotes:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/quotes
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteAdminLogin:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/admin/login
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteAdminProducts:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/admin/products
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteAdminProductsId:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/admin/products/{productId}
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteAdminDashboard:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/admin/dashboard
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteAdminLeads:
    Type: AWS::ApiGatewayV2::Route

    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/admin/leads
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteAdminLeadsId:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/admin/leads/{leadId}
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteAdminQuotes:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/admin/quotes
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  ApiRouteAdminQuotesId:
    Type: AWS::ApiGatewayV2::Route
    Condition: BackendEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/admin/quotes/{quoteId}
      Target: !Sub 'integrations/${ApiLambdaIntegration}'

  # Lambda permission for API Gateway
  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: BackendEnabled
    Properties:
      FunctionName: !GetAtt ApiLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # ======================================================================
  # CLOUDWATCH DASHBOARD — Backend
  # ======================================================================
  BackendDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: BackendEnabled
    Properties:
      DashboardName: !Sub '${ProjectName}-${Environment}-api-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Errors", { "stat": "Sum", "period": 300, "label": "Lambda Errors" } ],
                  [ "AWS/Lambda", "Invocations", { "stat": "Sum", "period": 300, "label": "Invocations" } ],
                  [ "AWS/Lambda", "Throttles", { "stat": "Sum", "period": 300, "label": "Throttles" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Metrics",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Duration", { "stat": "p95", "period": 300, "label": "Duration P95 (ms)" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Duration",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApiGateway", "4xx", { "stat": "Sum", "period": 300 } ],
                  [ "AWS/ApiGateway", "5xx", { "stat": "Sum", "period": 300 } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "API Gateway Errors",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", { "stat": "Sum", "period": 300 } ],
                  [ "AWS/DynamoDB", "ConsumedWriteCapacityUnits", { "stat": "Sum", "period": 300 } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "DynamoDB Capacity",
                "period": 300
              }
            }
          ]
        }

  # ======================================================================
  # CLOUDWATCH ALARMS
  # ======================================================================
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: BackendEnabled
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-lambda-errors'
      AlarmDescription: !Sub 'Lambda errors in ${ProjectName} ${Environment} backend'
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiLambda

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: AlarmsEnabled
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-alarms'
      DisplayName: !Sub '${ProjectName} ${Environment} Alarms'

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: AlarmsEnabled
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  LambdaErrorAlarmAction:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-lambda-errors-action'
      AlarmDescription: !Sub 'Lambda errors with SNS notification for ${ProjectName} ${Environment}'
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiLambda

  # ======================================================================
  # FRONTEND CLOUDWATCH DASHBOARD
  # ======================================================================
  FrontendDashboard:
    Type: AWS::CloudWatch::Dashboard
    DependsOn:
      - WebsiteDistribution
    Properties:
      DashboardName: !Sub '${ProjectName}-${Environment}-cdn-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/CloudFront", "Requests", { "region": "us-east-1", "stat": "Sum", "period": 300 } ],
                  [ "AWS/CloudFront", "TotalErrorRate", { "region": "us-east-1", "stat": "Average", "period": 300 } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "title": "CloudFront Requests & Error Rate",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/CloudFront", "BytesDownloaded", { "region": "us-east-1", "stat": "Sum", "period": 300 } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "title": "Bytes Downloaded",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/WAFV2", "BlockedRequests", { "region": "us-east-1", "stat": "Sum", "period": 300 } ],
                  [ "AWS/WAFV2", "AllowedRequests", { "region": "us-east-1", "stat": "Sum", "period": 300 } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "title": "WAF Requests",
                "period": 300
              }
            }
          ]
        }

Outputs:
  WebsiteUrl:
    Description: CloudFront distribution URL
    Value: !Sub 'https://${WebsiteDistribution.DomainName}'
  WebsiteBucketName:
    Description: S3 bucket for static assets
    Value: !Ref WebsiteBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref WebsiteDistribution
  CloudFrontDomainName:
    Description: CloudFront domain name
    Value: !GetAtt WebsiteDistribution.DomainName
  WafWebACLArn:
    Description: WAF WebACL ARN
    Value: !GetAtt WebACL.Arn
  LogsBucketName:
    Description: CloudFront logs bucket
    Value: !Ref LogsBucket
  AdminAuthFunctionArn:
    Description: CloudFront Function ARN for admin auth
    Value: !GetAtt AdminAuthFunction.FunctionARN
  ApiEndpoint:
    Description: API Gateway HTTP API endpoint
    Condition: BackendEnabled
    Value: !GetAtt HttpApi.ApiEndpoint
  SSMSecretPath:
    Description: Path in SSM Parameter Store for secrets
    Value: !Sub '/${ProjectName}/${Environment}/'
  BackendDashboardName:
    Description: Backend CloudWatch dashboard
    Condition: BackendEnabled
    Value: !Ref BackendDashboard
  FrontendDashboardName:
    Description: Frontend CloudWatch dashboard
    Value: !Ref FrontendDashboard
