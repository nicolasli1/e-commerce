<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Website</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #a0a0a0; font-size: 1.125rem; margin-bottom: 2rem; }
    .badge { display: inline-block; padding: 0.5rem 1rem; border-radius: 9999px; background: #1a1a2e; border: 1px solid #312e81; color: #a5b4fc; font-size: 0.875rem; margin-top: 1rem; }
    .status { margin-top: 2rem; padding: 1rem; border-radius: 0.5rem; background: #111827; border: 1px solid #1f2937; }
    .status.ok { border-color: #065f46; }
    .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 0.5rem; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sales Website</h1>
    <p>Tu sitio de ventas en AWS · S3 + CloudFront + WAF</p>
    <div class="badge">🚀 v1.0.0</div>
    <div class="status ok" id="health">
      <span class="dot"></span> Verificando conexión...
    </div>
  </div>

  <script>
    (async () => {
      const el = document.getElementById('health');
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        el.innerHTML = `<span class="dot"></span> API: ${data.ok ? '✅ Conectado' : '⚠️ Error'} — ${data.service || 'sales-api'}`;
      } catch {
        el.innerHTML = `<span style="color:#f87171">⚠️ Backend no disponible (solo frontend estático)</span>`;
      }
    })();
  </script>
</body>
</html>
