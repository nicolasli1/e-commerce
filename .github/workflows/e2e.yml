name: E2E Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - 'backoffice/**'
      - 'infra/cdk/lambda_src/**'
      - 'tests/e2e/**'
      - 'tests/requirements-e2e.txt'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  E2E_BASE_URL: 'https://d1ag0uf6e1dp20.cloudfront.net'
  E2E_TIMEOUT: '30'
  E2E_HEADLESS: 'true'

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install pytest requests
      - name: Run smoke tests
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            python -m pytest tests/e2e/test_smoke.py -v --tb=short \
              --junitxml=report/smoke-results.xml -k "not skip" \
              && echo "Smoke passed" && exit 0
            echo "Retrying in 10s..."
            sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: report/

  e2e:
    name: E2E UI Tests
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tests/requirements-e2e.txt
      - name: Install deps
        run: |
          pip install -r tests/requirements-e2e.txt
          python -m playwright install chromium --with-deps
      - name: Run E2E tests
        run: |
          python -m pytest tests/e2e/test_homepage.py \
            -v --tb=short --durations=5 \
            --junitxml=report/e2e-results.xml \
            --base-url=${{ env.E2E_BASE_URL }} -x
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: report/
