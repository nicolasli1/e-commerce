name: Rotate Admin Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod

env:
  PROJECT_NAME: sales-website
  PYTHON_VERSION: '3.12'

jobs:
  rotate:
    name: Rotate SSM Secrets (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      BACKEND_REGION: ${{ secrets.AWS_BACKEND_REGION || 'us-east-2' }}

    steps:
      - uses: actions/checkout@v4

      # --- AWS credentials ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.BACKEND_REGION }}

      # --- Setup Python ---
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --- Rotate secrets ---
      - name: Rotate admin secrets
        id: secrets
        run: |
          SSM_PATH="/${{ env.PROJECT_NAME }}/${{ env.ENVIRONMENT }}"
          REGION="${{ env.BACKEND_REGION }}"

          echo "🔄 Rotating secrets at ${SSM_PATH} (${REGION})..."

          # admin-user (String)
          USERNAME="admin"
          aws ssm put-parameter \
            --name "${SSM_PATH}/admin-user" \
            --value "$USERNAME" \
            --type "String" \
            --description "Admin username for backoffice login" \
            --overwrite \
            --region "$REGION" > /dev/null
          echo "   ✅ admin-user"

          # admin-password (SecureString)
          PASSWORD=$(python3 -c "import secrets; print(secrets.token_urlsafe(16))")
          aws ssm put-parameter \
            --name "${SSM_PATH}/admin-password" \
            --value "$PASSWORD" \
            --type "SecureString" \
            --description "Admin password for backoffice login" \
            --overwrite \
            --region "$REGION" > /dev/null
          echo "   ✅ admin-password"

          # admin-session-secret (SecureString)
          SESSION_SECRET=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          aws ssm put-parameter \
            --name "${SSM_PATH}/admin-session-secret" \
            --value "$SESSION_SECRET" \
            --type "SecureString" \
            --description "Secret key for signing admin session tokens" \
            --overwrite \
            --region "$REGION" > /dev/null
          echo "   ✅ admin-session-secret"

          echo "PASSWORD=$PASSWORD" >> $GITHUB_OUTPUT

      # --- Summary ---
      - name: Show credentials
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  ✅ Secrets rotados exitosamente"
          echo ""
          echo "  SSM Path:  /${{ env.PROJECT_NAME }}/${{ env.ENVIRONMENT }}"
          echo "  Región:    ${{ env.BACKEND_REGION }}"
          echo "  Usuario:   admin"
          echo "  Password:  ${{ steps.secrets.outputs.PASSWORD }}"
          echo ""
          echo "  ⚠️  GUARDA ESTE PASSWORD AHORA"
          echo "     SecureStrings no se pueden recuperar después"
          echo "════════════════════════════════════════════════════"
