name: Deploy Sales Website

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  CDK_DIR: infra/cdk
  PROJECT_NAME: sales-website

jobs:
  # ================================================================
  # VALIDACIÓN
  # ================================================================
  validate:
    name: Validate CDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ env.CDK_DIR }}/requirements.txt

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        working-directory: ${{ env.CDK_DIR }}
        run: pip install -r requirements.txt

      - name: CDK Synth
        working-directory: ${{ env.CDK_DIR }}
        run: cdk synth --all

  # ================================================================
  # DEPLOY
  # ================================================================
  deploy:
    name: Deploy (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    environment: ${{ inputs.environment || 'dev' }}

    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      AWS_REGION: us-east-1
      BACKEND_REGION: ${{ secrets.AWS_BACKEND_REGION || 'us-east-2' }}

    steps:
      - uses: actions/checkout@v4

      # --- AWS credentials ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --- Setup ---
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ env.CDK_DIR }}/requirements.txt

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        working-directory: ${{ env.CDK_DIR }}
        run: pip install -r requirements.txt

      # --- Bootstrap (una vez) ---
      - name: CDK Bootstrap
        working-directory: ${{ env.CDK_DIR }}
        run: |
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.BACKEND_REGION }}

      # --- Deploy stacks ---
      - name: Deploy Backend Stack
        working-directory: ${{ env.CDK_DIR }}
        run: |
          cdk deploy ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-backend \
            --context environment=${{ env.ENVIRONMENT }} \
            --context enable_backend=true \
            --require-approval never

      - name: Deploy Frontend Stack
        working-directory: ${{ env.CDK_DIR }}
        run: |
          cdk deploy ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-frontend \
            --context environment=${{ env.ENVIRONMENT }} \
            --context price_class=PriceClass_100 \
            --require-approval never

      # --- Obtener outputs ---
      - name: Get Stack Outputs
        id: stack-outputs
        run: |
          FRONTEND_STACK="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-frontend"

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteBucketName`].OutputValue' \
            --output text)

          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)

          URL=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteUrl`].OutputValue' \
            --output text)

          echo "S3_BUCKET=$BUCKET" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_DIST_ID=$DIST_ID" >> $GITHUB_OUTPUT
          echo "WEBSITE_URL=$URL" >> $GITHUB_OUTPUT

      # --- Sync frontend a S3 ---
      - name: Sync frontend to S3
        run: |
          aws s3 sync ./frontend \
            s3://${{ steps.stack-outputs.outputs.S3_BUCKET }} \
            --delete

      # --- Sync backoffice a S3 (/admin/) ---
      - name: Sync backoffice to S3
        run: |
          aws s3 sync ./backoffice \
            s3://${{ steps.stack-outputs.outputs.S3_BUCKET }}/admin/ \
            --delete

      # --- Invalidar CloudFront ---
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack-outputs.outputs.CLOUDFRONT_DIST_ID }} \
            --paths '/*'

      # --- URL final ---
      - name: Show Website URL
        run: |
          echo ""
          echo "========================================"
          echo "  ✅ Deployed: ${{ steps.stack-outputs.outputs.WEBSITE_URL }}"
          echo "========================================"
