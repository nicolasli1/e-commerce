name: Deploy Sales Website

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod
      skip_secrets:
        description: 'Skip SSM secrets creation (use existing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  CDK_DIR: infra/cdk
  PROJECT_NAME: sales-website

jobs:
  # ================================================================
  # VALIDACIÓN — CDK synth + unit tests
  # ================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            ${{ env.CDK_DIR }}/requirements.txt
            tests/requirements-test.txt

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        working-directory: ${{ env.CDK_DIR }}
        run: pip install -r requirements.txt

      - name: CDK Synth
        working-directory: ${{ env.CDK_DIR }}
        run: cdk synth --all

      - name: Run unit tests
        run: |
          pip install -r tests/requirements-test.txt
          python -m pytest tests/unit/ -v --tb=short

  # ================================================================
  # DEPLOY
  # ================================================================
  deploy:
    name: Deploy (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    environment: ${{ inputs.environment || 'dev' }}

    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      AWS_REGION: us-east-1
      BACKEND_REGION: ${{ secrets.AWS_BACKEND_REGION || 'us-east-2' }}
      SKIP_SECRETS: ${{ inputs.skip_secrets || 'false' }}

    steps:
      - uses: actions/checkout@v4

      # --- AWS credentials ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --- Setup ---
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            ${{ env.CDK_DIR }}/requirements.txt
            tests/requirements-test.txt

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        working-directory: ${{ env.CDK_DIR }}
        run: |
          pip install -r requirements.txt
          pip install boto3

      # --- SSM Secrets (skip if already exist) ---
      - name: Create SSM Parameter Store secrets
        if: env.SKIP_SECRETS != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/deploy.py secrets create \
            --env ${{ env.ENVIRONMENT }} \
            --project ${{ env.PROJECT_NAME }} \
            --backend-region ${{ env.BACKEND_REGION }} \
            --admin-user ${{ secrets.ADMIN_USER || 'admin' }}

      # --- Bootstrap (one-time per account/region) ---
      - name: CDK Bootstrap
        working-directory: ${{ env.CDK_DIR }}
        run: |
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} \
            --context environment=${{ env.ENVIRONMENT }} \
            --context enable_backend=true
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.BACKEND_REGION }} \
            --context environment=${{ env.ENVIRONMENT }} \
            --context enable_backend=true

      # --- Deploy Backend ---
      - name: Deploy Backend Stack
        working-directory: ${{ env.CDK_DIR }}
        run: |
          cdk deploy ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-backend \
            --context environment=${{ env.ENVIRONMENT }} \
            --context enable_backend=true \
            --context alarm_email=${{ secrets.ALARM_EMAIL || '' }} \
            --require-approval never

      # --- Deploy Frontend ---
      - name: Deploy Frontend Stack
        working-directory: ${{ env.CDK_DIR }}
        run: |
          cdk deploy ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-frontend \
            --context environment=${{ env.ENVIRONMENT }} \
            --context price_class=PriceClass_100 \
            --require-approval never

      # --- Get Stack Outputs ---
      - name: Get Stack Outputs
        id: stack-outputs
        run: |
          FRONTEND_STACK="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-frontend"
          BACKEND_STACK="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-backend"

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteBucketName`].OutputValue' \
            --output text)

          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)

          URL=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteUrl`].OutputValue' \
            --output text)

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$BACKEND_STACK" \
            --region ${{ env.BACKEND_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text 2>/dev/null || echo ""

          echo "S3_BUCKET=$BUCKET" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_DIST_ID=$DIST_ID" >> $GITHUB_OUTPUT
          echo "WEBSITE_URL=$URL" >> $GITHUB_OUTPUT
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT

      # --- Sync frontend static assets to S3 ---
      - name: Sync frontend to S3
        run: |
          aws s3 sync ./frontend \
            s3://${{ steps.stack-outputs.outputs.S3_BUCKET }} \
            --delete \
            --cache-control "max-age=3600"

      # --- Sync backoffice SPA to S3 (/admin/) ---
      - name: Sync backoffice to S3
        run: |
          aws s3 sync ./backoffice \
            s3://${{ steps.stack-outputs.outputs.S3_BUCKET }}/admin/ \
            --delete \
            --cache-control "max-age=3600"

      # --- Invalidate CloudFront cache ---
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack-outputs.outputs.CLOUDFRONT_DIST_ID }} \
            --paths '/*'

      # --- Summary ---
      - name: Show Deployment Summary
        run: |
          echo ""
          echo "========================================"
          echo "  ✅ NexCore Deploy Complete"
          echo "  🌐 Website: ${{ steps.stack-outputs.outputs.WEBSITE_URL }}"
          echo "  🔌 API:     ${{ steps.stack-outputs.outputs.API_URL || 'N/A' }}"
          echo "  📦 Bucket:  ${{ steps.stack-outputs.outputs.S3_BUCKET }}"
          echo "  🆔 CF Dist: ${{ steps.stack-outputs.outputs.CLOUDFRONT_DIST_ID }}"
          echo "  📋 Dashboard: CloudWatch → ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-api-dashboard"
          echo "========================================"
