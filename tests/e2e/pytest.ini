[pytest]
# ─── Paths ──────────────────────────
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*

# ─── Output ──────────────────────────
addopts =
    -v
    --tb=short
    --showlocals
    --strict-markers
    --color=yes
    --capture=tee-sys
    --log-cli-level=INFO
    -p no:cacheprovider

# ─── Markers ─────────────────────────
markers =
    smoke: Smoke tests (rápidos, pre-deploy)
    api: API tests (sin navegador)
    ui: UI tests (con navegador)
    checkout: Tests de pago
    mobile: Tests responsive/mobile
    auth: Tests de autenticación
    slow: Tests que toman más de 30s
    wip: Work in progress (saltar por defecto)
